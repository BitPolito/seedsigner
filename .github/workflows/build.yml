name: Build

on:
  workflow_dispatch:
    inputs:
      expected_app_commit:
        description: "Exact 40-character BitPolito commit selected for this candidate"
        required: true
        type: string
      confirm_pi0_build:
        description: "Explicit confirmation"
        required: true
        type: choice
        options:
          - "DO NOT BUILD"
          - "BUILD PI0 CANDIDATE"

permissions:
  contents: read

env:
  BITPOLITO_VERSION: "0.8.7-bitpolito.1"
  BITPOLITO_APP_REPOSITORY: "https://github.com/BitPolito/seedsigner.git"
  SEEDSIGNER_OS_COMMIT: "d13859392660fe512a753bc14ecd0edc86c35510"
  DOCKER_DEFAULT_PLATFORM: "linux/amd64"

jobs:
  authorize:
    name: validate manual request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate manual approval inputs
        env:
          ACTUAL_APP_COMMIT: ${{ github.sha }}
          EXPECTED_APP_COMMIT: ${{ inputs.expected_app_commit }}
          BUILD_CONFIRMATION: ${{ inputs.confirm_pi0_build }}
        run: |
          test "${BUILD_CONFIRMATION}" = "BUILD PI0 CANDIDATE"
          test "${EXPECTED_APP_COMMIT}" = "${ACTUAL_APP_COMMIT}"
          printf '%s\n' "${EXPECTED_APP_COMMIT}" | grep -Eq '^[0-9a-f]{40}$'

  quality:
    needs: authorize
    name: release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Initialize official screenshot fixtures
        run: git -c submodule.seedsigner-screenshots.update=checkout submodule update --init --recursive
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r tests/requirements.txt -r l10n/requirements-l10n.txt -r tools/simulator/requirements-simulator.txt
          pip install -e .
      - name: Run release quality gate
        env:
          BITPOLITO_PYTHON: python
          BITPOLITO_ARTIFACTS_DIR: artifacts/quality
        run: ./scripts/run-quality-gate.sh --release
      - name: Archive visual quality gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitpolito-visual-quality-gate
          path: artifacts/quality/**
          if-no-files-found: warn
          retention-days: 30

  build:
    needs: quality
    name: pi0 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: bitpolito-image-build
    steps:
      - name: Checkout pinned SeedSigner OS
        uses: actions/checkout@v4
        with:
          repository: "SeedSigner/seedsigner-os"
          ref: ${{ env.SEEDSIGNER_OS_COMMIT }}
          submodules: recursive
          path: seedsigner-os
          fetch-depth: 0

      - name: Pin build metadata
        run: |
          echo "builder_hash=$(git -C seedsigner-os rev-parse --short HEAD)" >> "${GITHUB_ENV}"
          echo "app_commit=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "os_commit=$(git -C seedsigner-os rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "buildroot_commit=$(git -C seedsigner-os/opt/buildroot rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Restore official build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildroot-ccache/
            seedsigner-os/buildroot_dl
          key: build-cache-pi0-${{ env.builder_hash }}
          restore-keys: |
            build-cache-pi0-

      - name: Create official build container
        run: docker build --platform linux/amd64 -t seedsigner-os-build seedsigner-os

      - name: Build Pi Zero image through the official application path
        run: |
          mkdir -p ~/.buildroot-ccache seedsigner-os/buildroot_dl seedsigner-os/images
          docker run \
            --rm \
            -v "$(pwd)/seedsigner-os/opt:/opt" \
            -v "$(pwd)/seedsigner-os/images:/images" \
            -v "$(pwd)/seedsigner-os/buildroot_dl:/buildroot_dl" \
            -v "${HOME}/.buildroot-ccache:/root/.buildroot-ccache" \
            seedsigner-os-build \
            --pi0 \
            --app-repo="${BITPOLITO_APP_REPOSITORY}" \
            --app-commit-id="${app_commit}" \
            --no-clean

      - name: Name and verify candidate
        run: |
          source_image="seedsigner-os/images/seedsigner_os.${app_commit}.pi0.img"
          final_image="seedsigner-os/images/seedsigner_os.${BITPOLITO_VERSION}.pi0.img"
          test -f "${source_image}"
          mv "${source_image}" "${final_image}"
          (
            cd seedsigner-os/images
            sha256sum "seedsigner_os.${BITPOLITO_VERSION}.pi0.img" > "seedsigner_os.${BITPOLITO_VERSION}.pi0.sha256"
          )
          image_sha256="$(sha256sum "${final_image}" | awk '{print $1}')"
          {
            echo "image=seedsigner_os.${BITPOLITO_VERSION}.pi0.img"
            echo "application_commit=${app_commit}"
            echo "os_commit=${os_commit}"
            echo "buildroot_commit=${buildroot_commit}"
            echo "sha256=${image_sha256}"
          } > "seedsigner-os/images/seedsigner_os.${BITPOLITO_VERSION}.pi0.manifest.txt"
          test "${os_commit}" = "${SEEDSIGNER_OS_COMMIT}"
          test "${image_sha256}" = "$(sha256sum "${final_image}" | awk '{print $1}')"
          cat "seedsigner-os/images/seedsigner_os.${BITPOLITO_VERSION}.pi0.manifest.txt"

      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: seedsigner-os-${{ env.BITPOLITO_VERSION }}-pi0
          path: |
            seedsigner-os/images/seedsigner_os.*.pi0.img
            seedsigner-os/images/seedsigner_os.*.pi0.manifest.txt
            seedsigner-os/images/seedsigner_os.*.pi0.sha256
          if-no-files-found: error
          retention-days: 90
